# Сайт подарочных сертификатов Imbir. Приложение слушает 127.0.0.1:3000
# внутри Docker; наружу его отдаёт nginx, он же терминирует HTTPS.
server {
    server_name new.imbir.kz new.imbir.dev;

    # Видео на главной весит 2.5 МБ на ролик — без этого nginx буферизует в память
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        # Реальный IP посетителя нужен для rate limit и записи согласий (PRD §9)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/new.imbir.kz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/new.imbir.kz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    # Переход на https только если запрос ДЕЙСТВИТЕЛЬНО пришёл не по https.
    # Cloudflare в режиме Flexible соединяется с нами по 80, но сообщает
    # заголовком, что у посетителя https. Безусловный редирект (его ставит
    # certbot) давал бесконечную петлю: Cloudflare -> 80 -> 301 -> снова 80.
    if ($http_x_forwarded_proto != "https") {
        return 301 https://$host$request_uri;
    }


    listen 80;
    listen [::]:80;
    server_name new.imbir.kz new.imbir.dev;

    client_max_body_size 25m;

    # Запрос, пришедший от Cloudflare (заголовок говорит, что у посетителя
    # уже https), обслуживаем как обычно. Раньше здесь стоял return 404 от
    # certbot — он рассчитан на то, что редирект выше срабатывает всегда.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
    }


}