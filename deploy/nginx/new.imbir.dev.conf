# Сайт подарочных сертификатов Imbir. Приложение слушает 127.0.0.1:3000
# внутри Docker; наружу его отдаёт nginx, он же терминирует HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name new.imbir.dev;

    # Видео на главной весит 2.5 МБ на ролик — без этого nginx буферизует в память
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        # Реальный IP посетителя нужен для rate limit и записи согласий (PRD §9)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
    }
}
