# Production-стек: app + postgres + ежедневные бэкапы.
# Запуск: docker compose --env-file .env.production up -d --build
# HTTPS терминируется внешним reverse-proxy (Caddy/nginx/Traefik) перед app.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-imbir}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-imbir}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-imbir} -d ${POSTGRES_DB:-imbir}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Порт наружу не публикуем — доступ только из сети compose

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Задаются командой деплоя:
        #   BUILD_SHA=$(git rev-parse --short HEAD) BUILD_TIME=$(date -u +%FT%TZ)         #     docker compose --env-file .env.production up -d --build app
        BUILD_SHA: ${BUILD_SHA:-}
        BUILD_TIME: ${BUILD_TIME:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Весь .env.production целиком: флаги режимов (PAYMENT_MOCK, WHATSAPP_MOCK,
    # PREVIEW_NO_2FA) и секреты интеграций, которые ниже поимённо не перечислены.
    # Без этого контейнер стартовал с боевой оплатой вместо демо.
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-imbir}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-imbir}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET}
      # Публичный адрес админки для Auth.js. Без него библиотека определяет
      # адрес сама и за обратным прокси ошибается на localhost:3000 — тогда
      # любое действие в админке считает сессию чужой и разлогинивает
      # (поймано живьём 2026-08-21: ни одна форма в админке не сохранялась).
      AUTH_URL: ${SITE_URL:?set SITE_URL}
      AUTH_TRUST_HOST: "true"
      CODE_ENCRYPTION_KEY: ${CODE_ENCRYPTION_KEY:?set CODE_ENCRYPTION_KEY}
      SITE_URL: ${SITE_URL:?set SITE_URL}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MANAGER_EMAIL: ${MANAGER_EMAIL:-}
      KASPI_PAY_LINK_SLUG: ${KASPI_PAY_LINK_SLUG:-}
      KASPI_PAY_SERVICE_ID: ${KASPI_PAY_SERVICE_ID:-}
      KASPI_PAY_ORDER_FIELD_ID: ${KASPI_PAY_ORDER_FIELD_ID:-}
      KASPI_PAY_MERCHANT_ID: ${KASPI_PAY_MERCHANT_ID:-}
      KASPI_PAY_TERMINAL: ${KASPI_PAY_TERMINAL:-}
      KASPI_BRIDGE_TOKEN: ${KASPI_BRIDGE_TOKEN:-}
      FORTE_USERNAME: ${FORTE_USERNAME:-}
      FORTE_PASSWORD: ${FORTE_PASSWORD:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      RUN_SEED: ${RUN_SEED:-0}
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/ru').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-imbir}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-imbir}
      BACKUP_DIR: /backups
      # 90 дней: после исключения схемы pgboss копия весит ~136 КБ, квартал
      # занимает ~12 МБ — продление ничего не стоит, а запас на поздно
      # замеченную поломку даёт настоящий. Дольше держать не стоит: в копиях
      # персональные данные, и лишние месяцы — это ответственность, а не польза.
      RETENTION_DAYS: "90"
    volumes:
      # Монтируем КАТАЛОГ, а не файл. Пробросив отдельный файл, контейнер
      # держит его inode: `git pull` пишет новый файл и переименовывает поверх,
      # inode меняется, и внутри остаётся прежнее содержимое. Так контейнер
      # четыре дня незаметно выполнял самую первую версию скрипта, хотя в
      # репозитории она давно была исправлена (поймано 2026-08-24).
      - ./scripts:/opt/imbir-scripts:ro
      - backups:/backups
    # Раз в сутки: бэкап снимается при старте контейнера и дальше каждые 24 часа.
    # Это не расписание по часам — момент задаёт последний перезапуск стенда.
    entrypoint: ["sh", "-c", "while true; do sh /opt/imbir-scripts/backup-db.sh; sleep 86400; done"]

volumes:
  pgdata:
  backups:
